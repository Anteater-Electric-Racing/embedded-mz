[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Skip framework/toolchain headers that Cppcheck cannot parse.
check_skip_packages = yes

lib_deps =
	; Exact freertos-teensy 11.2.0-3 (tag v11.2.0_v3), matching the working copy.
	https://github.com/tsandmann/freertos-teensy.git#7e6ae6a4956ce8069b7661ffe75e9d70c9a37bbe
	https://github.com/kdao18/WDT_T4.git

